<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nứa Xứ Thanh · Đặt bút khắc tên</title>
<style>*{box-sizing:border-box}body{margin:0;color:#203c2c;background:#f9f7ee;font:17px/1.55 system-ui}header,main,footer{max-width:1140px;margin:auto;padding:22px 5%}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cccfbf}header strong{font: bold 27px Georgia}a{color:inherit}main{display:grid;grid-template-columns:1.15fr 1fr;gap:5%;padding-top:46px}img{width:100%;display:block;border-radius:18px}h1,h2{font-family:Georgia,serif;line-height:1.15}h1{font-size:clamp(40px,5vw,65px);margin:0 0 16px}h2{margin:0 0 18px}form{background:white;padding:28px;border:1px solid #d4dacb;border-radius:18px}label{display:block;margin-top:15px;font-weight:600}input,button{width:100%;padding:12px;font:inherit;border:1px solid #aabbab;border-radius:7px}button{background:#254a34;color:white;cursor:pointer;font-weight:bold}small{display:block;margin-top:12px}output{float:right;font-weight:bold}dialog{max-width:min(90vw,470px);border:0;padding:26px;border-radius:14px}dialog::backdrop{background:#15241bb8}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}dialog button{margin-top:8px}footer{margin-top:32px;border-top:1px solid #cccfbf}@media(max-width:760px){main{grid-template-columns:1fr;gap:24px;padding-top:24px}form{padding:20px}}</style>
<header><strong>Nứa Xứ Thanh</strong><a href="#dat">Đặt bút</a></header><main><section><h1>Bút nứa khắc tên</h1><p>Chọn số lượng và gửi gắm một cái tên hay lời nhắn trên thân bút nứa.</p><img src="but-nua.webp" alt="Bút nứa khắc chữ và ống đựng bút bằng nứa"><p><b>28.000 ₫</b> / chiếc · Giá tạm tính</p></section><form id="dat"><h2>Đặt bút của bạn</h2><label for="khac">Nội dung muốn khắc</label><input id="khac" maxlength="80" placeholder="Ví dụ: Minh Anh"><label for="sl">Số lượng bút</label><input id="sl" type="number" min="1" max="999" required value="1"><label for="ten">Tên người đặt</label><input id="ten" required maxlength="80" autocomplete="name"><label for="sdt">Số điện thoại liên hệ</label><input id="sdt" type="tel" required pattern="[0-9+ ]{9,18}" autocomplete="tel"><p>Tiền bút <output id="tong"></output></p><button>Tạo phiếu đặt bút</button><small>Sau khi tạo phiếu, hãy gửi cho người bán để xác nhận đơn và phí giao hàng.</small></form></main><footer>Nứa Xứ Thanh · Bút bi từ nứa tự nhiên</footer><dialog id="phieu"><h2>Phiếu đặt bút</h2><pre id="noidung"></pre><button id="gui">Chia sẻ phiếu</button><button id="dong">Quay lại</button><p role="status" id="msg"></p></dialog><script>
const el=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('vi-VN').format(n)+' ₫';
function tinh(){el('tong').value=el('sl').validity.valid?money(28000*Number(el('sl').value)):'—'}el('sl').oninput=tinh;tinh();
el('dat').onsubmit=e=>{e.preventDefault();el('noidung').textContent=['ĐẶT BÚT NỨA XỨ THANH','Người đặt: '+el('ten').value.trim(),'Điện thoại: '+el('sdt').value,'Nội dung khắc: '+(el('khac').value.trim()||'Không khắc'),'Số lượng: '+el('sl').value,'Tiền bút: '+el('tong').value,'Phí giao hàng: chờ xác nhận'].join('\n');el('msg').textContent='';el('phieu').showModal()};
el('dong').onclick=()=>el('phieu').close();el('gui').textContent=navigator.share?'Chia sẻ phiếu':'Sao chép phiếu';el('gui').onclick=async()=>{try{const text=el('noidung').textContent;if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);el('msg').textContent='Đã sao chép. Hãy dán phiếu vào tin nhắn cho người bán.'}}catch(e){if(e.name!=='AbortError')el('msg').textContent='Hãy chọn nội dung phiếu và sao chép để gửi.'}};
</script></html>
